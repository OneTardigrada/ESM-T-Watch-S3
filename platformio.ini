
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:twatch-s3]
; pioarduino mit Arduino Core 3.3.7 (LilyGoLib braucht >= 3.3.0)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
; Eigenes Board mit ARDUINO_T_WATCH_S3 Makro (boards/ Ordner)
board = lilygo-t-watch-s3
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_ldf_mode = deep

; --- Upload-Konfiguration (T-Watch S3 mit nativer USB-CDC) ---
; Problem: Native USB-CDC verschwindet bei Crash/Light-Sleep/Reset
; Loesung: esptool nutzt USB-JTAG-Reset (--before=usb_reset) um Chip
; automatisch in Download-Modus zu zwingen, OHNE BOOT-Knopf druecken zu muessen.
; Falls das nicht funktioniert: BOOT-Knopf druecken + Reset-Knopf kurz druecken
; und BOOT loslassen → Chip ist im ROM-Bootloader (USB-JTAG 303A:1002 erscheint).
upload_protocol = esptool
upload_speed = 460800
upload_flags =
  --before=usb_reset
  --after=hard_reset

; --- Port-Auswahl ---
; Auto-Detection wuerde sonst COM1 (Mainboard-ACPI-Phantomport) erwischen
; und mit "PermissionError 13 / Zugriff verweigert" scheitern.
; Fix 2 (primaer, robust): per VID:PID finden — funktioniert auch wenn die
;   COM-Nummer wechselt oder der Chip im ROM-Bootloader-Modus ist.
;   303A:1001 = Run-Mode (native USB-CDC), 303A:1002 = ROM-Bootloader (BOOT+RESET).
upload_port  = hwgrep://303A:100[12]
monitor_port = hwgrep://303A:100[12]
; Fix 1 (Fallback, falls hwgrep nicht greift): feste COM-Nummer eintragen.
;upload_port  = COM5
;monitor_port = COM5

; --- Monitor: nicht resetten beim Anschluss (sonst Reboot bei jedem 'pio device monitor') ---
monitor_dtr = 0
monitor_rts = 0

build_flags = 
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D BOARD_HAS_PSRAM
  -D ARDUINO_LILYGO_LORA_SX1262
lib_deps =
  https://github.com/Xinyuan-LilyGO/LilyGoLib.git
  mikalhart/TinyGPSPlus
  lewisxhe/XPowersLib@0.3.3
  lvgl/lvgl@9.2.2
  bblanchon/ArduinoJson@^7